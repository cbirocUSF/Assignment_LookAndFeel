<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mountainview Institute of Technology brand mark
  Crossed prospector's pickaxes over a mountain range.
  Author: Christopher Biroc - ISM 6225 Assignment 1
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" preserveAspectRatio="xMidYMid meet"
     role="img" aria-label="Mountainview Institute of Technology crest" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <defs>
    <clipPath id="crestClip">
      <circle cx="24" cy="24" r="21"/>
    </clipPath>
  </defs>

  <!-- Crest background -->
  <circle cx="24" cy="24" r="23" fill="#2f4f4f"/>
  <circle cx="24" cy="24" r="21" fill="#367588"/>

  <g clip-path="url(#crestClip)">
    <!-- Rising sun -->
    <circle cx="24" cy="22" r="7.5" fill="#f0d784"/>

    <!-- Back ridge -->
    <polygon points="-2,34 9,20 18,30 27,17 38,31 50,21 50,46 -2,46" fill="#2b5e6d"/>

    <!-- Front ridge with snow caps -->
    <polygon points="-2,40 12,26 24,37 36,24 50,38 50,46 -2,46" fill="#243c3c"/>
    <polygon points="12,26 8,30 16,30" fill="#ffffff"/>
    <polygon points="36,24 32,28 40,28" fill="#ffffff"/>
  </g>

  <!-- Crossed pickaxes -->
  <g stroke-linecap="round">
    <!-- Handles -->
    <line x1="14" y1="36" x2="34" y2="14" stroke="#c9a227" stroke-width="2.6"/>
    <line x1="34" y1="36" x2="14" y2="14" stroke="#c9a227" stroke-width="2.6"/>
    <!-- Pick heads -->
    <path d="M31 11.5 a6 6 0 0 1 6 6" fill="none" stroke="#f0d784" stroke-width="2.6"/>
    <path d="M17 11.5 a6 6 0 0 0 -6 6" fill="none" stroke="#f0d784" stroke-width="2.6"/>
  </g>

  <!-- Gold outer ring -->
  <circle cx="24" cy="24" r="22.6" fill="none" stroke="#c9a227" stroke-width="1.6"/>
</svg>
